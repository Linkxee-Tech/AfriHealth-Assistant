[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "afrihealth-assistant"
version = "0.2.0"
description = "Intelligent Healthcare, Offline. For Africa."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "langchain>=0.2,<1",
    "langchain-community>=0.2,<1",
    "chromadb>=0.5,<2",
    "sentence-transformers>=3,<6",
    "passlib[bcrypt]>=1.7.4,<2",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "pyjwt>=2.8,<3",
    "python-multipart>=0.0.10",
    "python-dotenv>=1,<2",
    "requests>=2.27,<3",
    "psutil>=5.9,<8",
    "aiofiles>=23,<25",
    "pypdf>=4,<7",
    "python-docx>=1,<2",
    "duckduckgo-search>=6,<9",
    "google-genai>=1,<2",
    "huggingface-hub>=0.20,<2",
    "pillow>=9.5,<13",
    "pandas>=1.5,<3",
    "prometheus-client>=0.20,<1",
    "reportlab>=4,<5",
    "feedparser>=6,<7",
]

[project.optional-dependencies]
local = [
    "llama-cpp-python>=0.3,<1",
    "easyocr>=1.7,<2",
    "faster-whisper>=1.0,<2",
]
dev = [
    "pytest>=8.2.2",
    "black>=24.4.2",
    "ruff>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.black]
line-length = 100
target-version = ['py310']
