version: "3.9"

services:
  afrihealth:
    build: .
    container_name: afrihealth-assistant
    ports:
      - "8000:8000"    # FastAPI backend
      - "8501:8501"    # Streamlit frontend
    volumes:
      - ./backend/data:/app/backend/data          # persist DB + vector store
      - ./backend/models:/app/backend/models      # persist downloaded models
    environment:
      - DEBUG=False
      - NUM_THREADS=4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
